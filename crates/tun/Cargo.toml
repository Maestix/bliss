[package]
name = "bliss-tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "The TUN adapter: Wintun, a userspace stack, and its traffic handed to the same outbound as every other inbound"

[dependencies]
async-trait.workspace = true
bliss-core = { path = "../core" }
thiserror.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(any(windows, target_os = "linux", target_os = "android"))'.dependencies]
ipstack.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# The device's ioctls, and netlink for its routes.
libc.workspace = true

[target."cfg(windows)".dependencies]
wintun-bindings.workspace = true
windows = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
bliss-proto = { path = "../proto" }
sha2.workspace = true
