[package]
name = "bliss"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "VLESS + REALITY client for Windows and Linux"

[[bin]]
name = "bliss"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# Off by default only for A/B measurement:
#   cargo run --release --no-default-features -- …
mimalloc = ["dep:mimalloc"]

[dependencies]
bliss-core = { path = "../core" }
bliss-openvpn = { path = "../openvpn" }
bliss-proto = { path = "../proto" }
bliss-tun = { path = "../tun" }
bliss-xray = { path = "../xray" }
base64.workspace = true                                # the status card's picture, inlined into the stylesheet
clap = { workspace = true, features = ["derive"] }
dioxus = { workspace = true, features = ["desktop"] }
color-eyre.workspace = true
directories.workspace = true
futures-util.workspace = true                          # reading a subscription up to a size cap
jiff.workspace = true
mimalloc = { workspace = true, optional = true }
reqwest.workspace = true                               # fetching subscriptions, as bliss-xray fetches the engine
tokio = { workspace = true }
toml.workspace = true
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = [
    "Win32_System_Console",
    # CONOUT$ and CONIN$, for a command run from cmd or PowerShell: see
    # attach_console in main.rs.
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    # Copying a log line out. Through the Win32 clipboard rather than
    # navigator.clipboard, which wants a secure context this window does not
    # have — it is served from a custom protocol.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Starting with Windows: bliss's value under the user's Run key; see startup.rs.
    "Win32_System_Registry",
    # One window at a time: a named mutex, held by whichever copy has it.
    "Win32_System_Threading",
    # The tray's menu leaves at once rather than fading: see `animated` in ui.rs.
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
# The single-window claim and the log's lock (flock), and asking whether the
# tray's library is there before tray-icon panics without it (dlopen).
libc.workspace = true

[build-dependencies]
# bliss.rc -> the icon inside bliss.exe; see build.rs.
embed-resource.workspace = true

[dev-dependencies]
jpeg-decoder.workspace = true
