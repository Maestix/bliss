# Builds bliss for Linux, Windows and Android and, for a tag `v*`, puts the
# files on the tag's GitHub release, so a person can download bliss instead
# of building it. Run by hand (Actions → release → Run workflow) it builds
# the same and leaves the files as the run's artifacts.
#
# Android's APK is signed with the one key every release uses, so each
# installs over the last. The key is not in the repository: the secrets
# ANDROID_KEYSTORE_B64 (the keystore, base64) and ANDROID_KEYSTORE_PASSWORD
# hold it, and a build without them stops rather than ship another key.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # 22.04, not the newest: a binary needs the glibc it was linked against
    # or newer, and one built on 24.04 needs 2.39, which Ubuntu 22.04,
    # Debian 12 and Mint 21 do not have (AGENTS.md §12).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries, and the build
        run: ./build-linux.sh --yes
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          mkdir -p dist
          cp target/release/bliss dist/bliss
          tar -C dist -czf "dist/bliss-${version}-linux-x86_64.tar.gz" bliss
          packaging/linux/make-deb.sh target/release/bliss "$version" "dist/bliss-${version}-linux-amd64.deb"
          rm dist/bliss
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rc.exe for the icon (crates/app/build.rs) comes with the runner's
      # Windows SDK; wintun.dll is inside the binary.
      - name: Build
        run: cargo build --release --locked -p bliss
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          mkdir -p dist
          cp target/release/bliss.exe "dist/bliss-${version}-windows-x86_64.exe"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # xray is built from source for the phone (android/build-native.sh);
      # Go fetches the newer toolchain xray asks for by itself.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Native libraries (libbliss.so, libxray.so)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-native.sh
      - name: Signing key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD are not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > bliss.keystore
          {
            echo "storeFile=bliss.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
      - name: APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/bliss-${version}-android-arm64.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A tag with a dash (v0.5.0-rc1) is a test build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
